<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harbury Tech Man – Sales Queries</title>
<meta name="theme-color" content="#0d3b7a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#d6eef6;--card:#fff;--tx:#0e2a4d;--mut:#4a6785;--bd:#a9cde3;--ac:#0d3b7a;--or:#f28c28;--ok:#1a7f37;--warn:#c2610c;--bad:#c62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1e3d;--card:#10305c;--tx:#eaf3fb;--mut:#9db8d4;--bd:#24508a;--ac:#3b82d6;--or:#f28c28;--ok:#4cc26b;--warn:#f0a040;--bad:#ef6a6a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1e3d;--card:#10305c;--tx:#eaf3fb;--mut:#9db8d4;--bd:#24508a;--ac:#3b82d6;--or:#f28c28;--ok:#4cc26b;--warn:#f0a040;--bad:#ef6a6a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);margin:4px 0 10px}
textarea{min-height:70px}
label{font-size:13px;color:var(--mut)}
button{border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.sec{background:transparent;border:1px solid var(--bd);color:var(--tx)}
button.del{background:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{white-space:nowrap;padding:6px 12px;background:transparent;border:1px solid var(--bd);color:var(--tx);border-radius:16px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mut{color:var(--mut);font-size:14px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.open{color:var(--warn)}.follow_up{color:var(--ac)}.resolved{color:var(--ok)}
.top{display:flex;align-items:center;gap:12px;background:#0d3b7a;color:#fff;border-radius:12px;padding:10px 12px;margin:4px 0 12px;border-bottom:4px solid var(--or)}
.top .logo{width:48px;height:48px;border-radius:50%}
.brand{font-family:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;font-size:22px;letter-spacing:.5px;line-height:1.1}
.sub{font-size:13px;opacity:.85}
.top button{margin-left:auto;background:transparent;border:1px solid #ffffff88;color:#fff;padding:6px 10px}
.tag-line{color:var(--mut);margin:-4px 0 12px;font-size:14px}
.card.appt{border-left:4px solid var(--or)}
.fab{position:fixed;background:var(--or);right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:28px;font-size:28px;padding:0;box-shadow:0 2px 8px #0006}
#sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:5}
#sheet .in{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--bad);font-size:14px;min-height:18px}
.hide{display:none!important}
</style>
</head>

<script>
const sb=supabase.createClient("https://rsvcqtfgidhrumtopiqb.supabase.co","sb_publishable_g0AEuI2TjWM1jjcNQPPfBg_7g2b0JzL");
const $=id=>document.getElementById(id);
let rows=[],filter="all",editId=null;
const LBL={open:"Open",follow_up:"Follow-up",resolved:"Resolved"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const isoLocal=d=>{const x=new Date(d),p=n=>String(n).padStart(2,"0");return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}T${p(x.getHours())}:${p(x.getMinutes())}`};

async function init(){
  const {data}=await sb.auth.getSession();
  data.session?showApp():showLogin();
}
function showLogin(){$("login").classList.remove("hide");$("app").classList.add("hide")}
async function showApp(){$("login").classList.add("hide");$("app").classList.remove("hide");await load()}
async function signIn(){
  $("lerr").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error){$("lerr").textContent=error.message;return}
  showApp();
}
async function signOut(){await sb.auth.signOut();rows=[];showLogin()}

async function load(){
  const {data,error}=await sb.from("sales_queries").select("*").order("created_at",{ascending:false});
  if(error){$("list").innerHTML='<div class="card err">'+esc(error.message)+'</div>';return}
  rows=data;render();
}
function sameDay(a,b){return a.toDateString()===b.toDateString()}
function render(){
  const chips=[["all","All"],["today","Today"],["appts","Appointments"],["open","Open"],["follow_up","Follow-up"],["resolved","Resolved"]];
  $("chips").innerHTML=chips.map(([k,l])=>`<button class="chip ${filter===k?"on":""}" onclick="setF('${k}')">${l}</button>`).join("");
  const q=$("q").value.toLowerCase(),now=new Date();
  let r=rows.filter(x=>{
    if(filter==="today"&&!(x.appointment_at&&sameDay(new Date(x.appointment_at),now)))return false;
    if(filter==="appts"&&!(x.appointment_at&&new Date(x.appointment_at)>=new Date(now.toDateString())))return false;
    if(["open","follow_up","resolved"].includes(filter)&&x.status!==filter)return false;
    return !q||[x.customer_name,x.address,x.query,x.resolution,x.notes].join(" ").toLowerCase().includes(q);
  });
  if(filter==="today"||filter==="appts")r.sort((a,b)=>new Date(a.appointment_at)-new Date(b.appointment_at));
  $("list").innerHTML=r.length?r.map(x=>`<div class="card ${x.appointment_at?"appt":""}" onclick="openForm('${x.id}')">
    <div class="row"><b>${esc(x.customer_name)}</b><span class="tag ${x.status}">${LBL[x.status]}</span></div>
    ${x.address?`<div class="mut">${esc(x.address)}</div>`:""}
    ${x.appointment_at?`<div>📅 ${fmt(x.appointment_at)}</div>`:""}
    ${x.query?`<div style="margin-top:6px">${esc(x.query)}</div>`:""}
    ${x.resolution?`<div class="mut">✔ ${esc(x.resolution)}</div>`:""}
    <div class="mut" style="margin-top:4px">${esc(x.feeling||"")} · ${new Date(x.created_at).toLocaleDateString("en-GB")}</div>
  </div>`).join(""):'<div class="mut" style="text-align:center;padding:30px">Nothing here yet</div>';
}
function setF(k){filter=k;render()}
function togAppt(){$("apptBox").classList.toggle("hide",!$("f_has").checked)}
function openForm(id){
  editId=id||null;
  const x=id?rows.find(r=>r.id===id):{};
  $("ftitle").textContent=id?"Edit query":"New query";
  $("f_name").value=x.customer_name||"";$("f_addr").value=x.address||"";
  $("f_query").value=x.query||"";$("f_res").value=x.resolution||"";
  $("f_has").checked=!!x.appointment_at;$("f_appt").value=x.appointment_at?isoLocal(x.appointment_at):"";
  $("f_feel").value=x.feeling||"";$("f_status").value=x.status||"open";$("f_notes").value=x.notes||"";
  togAppt();$("ferr").textContent="";$("delBtn").classList.toggle("hide",!id);
  $("sheet").style.display="flex";
}
function closeForm(){$("sheet").style.display="none"}
async function save(){
  const name=$("f_name").value.trim();
  if(!name){$("ferr").textContent="Customer name is required";return}
  const has=$("f_has").checked&&$("f_appt").value;
  const rec={customer_name:name,address:$("f_addr").value.trim()||null,query:$("f_query").value.trim()||null,
    resolution:$("f_res").value.trim()||null,has_appointment:!!has,appointment_at:has?new Date($("f_appt").value).toISOString():null,
    feeling:$("f_feel").value||null,status:$("f_status").value,notes:$("f_notes").value.trim()||null,updated_at:new Date().toISOString()};
  const {error}=editId?await sb.from("sales_queries").update(rec).eq("id",editId):await sb.from("sales_queries").insert(rec);
  if(error){$("ferr").textContent=error.message;return}
  closeForm();load();
}
async function del(){
  if(!confirm("Delete this entry?"))return;
  const {error}=await sb.from("sales_queries").delete().eq("id",editId);
  if(error){$("ferr").textContent=error.message;return}
  closeForm();load();
}
init();
</script>
</body>
